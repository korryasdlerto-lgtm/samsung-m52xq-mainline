# M52XQ: no RTC time on first boots (clock can be weeks off until NTP syncs),
# and with DNSSEC validation systemd-resolved then rejects every answer as
# "signature-expired" -> SERVFAIL for all names, including pool.ntp.org, so
# the clock can never be fixed either (в30, 2026-10-02). Plain DNS.
[Resolve]
DNSSEC=no
