# M52XQ: iio-sensor-proxy probes sensors only once at start; on this boot it came up ~25 s before the
# ADSP sensor PD registered the accelerometer/proximity (only light was found). Wait until SSC really
# streams accelerometer data (max 60 s), then start anyway.
[Unit]
After=hexagonrpcd-adsp-sensorspd.service

[Service]
TimeoutStartSec=120
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 60 ]; do timeout 4 ssccli --sensor accelerometer 2>/dev/null | grep -q measurement && exit 0; i=$((i+1)); sleep 1; done; exit 0'
