# M52XQ: start the Plasma Mobile session only once iio-sensor-proxy is up.
# Our iio-sensor-proxy drop-in waits (up to 60 s) for SSC to stream the
# accelerometer before starting; on the в33 first boot that took until 165 s,
# and KWin/plasmashell kept calling the not-yet-running net.hadess.SensorProxy
# -> plasmashell's main thread stalled (homescreen icons never drawn, screen
# "frozen" with the USB-mode notification, kded "Failed to notify ... NoReply");
# restarting plasmashell later fixed it. Ordering the session after the sensor
# service avoids that, at the cost of a later desktop on slow-sensor boots.
[Unit]
Wants=iio-sensor-proxy.service
After=iio-sensor-proxy.service
