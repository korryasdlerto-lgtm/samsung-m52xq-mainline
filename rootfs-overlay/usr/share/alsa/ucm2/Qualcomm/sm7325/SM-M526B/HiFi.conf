# Mixer paths verified live on the device (2026-09-26): earpiece tone audible, AMIC1 records,
# loud speaker (TFA9878 on QUINARY MI2S, boot v102 + vendor_boot v146) audible.

SectionVerb {
	Value {
		TQ "HiFi"
	}
	# MultiMedia1 needs a backend already when PulseAudio probes the
	# profile (before any device is enabled): default to the speaker.
	EnableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]
}

SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Earpiece"
	]

	# The speaker is the default route (set by the verb). Disabling it must
	# not leave MultiMedia1 without a backend: PulseAudio enables/disables
	# every device while probing, so the disable sequence leaves QUIN on.
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_COMP1 Switch' 0"
		cset "name='HPHL_COMP Switch' 0"
		cset "name='RX_EAR Mode Switch' 1"
		cset "name='RX HPH Mode' CLS_H_LOHIFI"
		cset "name='RDAC3_MUX' RX1"
		cset "name='EAR_RDAC Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='CLSH Switch' 1"
	]
	DisableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='EAR_RDAC Switch' 0"
		cset "name='HPHL Switch' 0"
		cset "name='CLSH Switch' 0"
		cset "name='RX_EAR Mode Switch' 0"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX_MACRO RX0 MUX' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 16"
		cset "name='TX_DEC0 Volume' 94"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		# M52XQ: second (top) microphone AMIC4 -> ADC3 INP4 -> SoundWire TX port 2 -> SWR_MIC4 ("SWR_DMIC0" in the
		# mainline v9 names) -> DEC1 = right channel; needs the DT route "TX SWR_DMIC0" <- ADC3_OUTPUT (DTS v141)
		cset "name='ADC3 MUX' INP4"
		cset "name='ADC3_MIXER Switch' 1"
		cset "name='ADC3 Switch' 1"
		cset "name='ADC3 Volume' 16"
		cset "name='TX_DEC1 Volume' 94"
		cset "name='TX2 MODE' ADC_NORMAL"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_DMIC0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='DEC1 MODE' ADC_DEFAULT"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC3_MIXER Switch' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}
