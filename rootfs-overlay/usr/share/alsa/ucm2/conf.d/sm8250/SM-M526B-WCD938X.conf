# Samsung Galaxy M52 5G (SM-M526B, SM7325): WCD938x on LPASS codec DMA via q6afe (APR)
Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm7325/SM-M526B/HiFi.conf"
	Comment "HiFi quality Music"
}

BootSequence [
	cset "name='EAR_PA Volume' 6"
	cset "name='ADC1 Volume' 12"
	cset "name='TX_DEC0 Volume' 100"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
