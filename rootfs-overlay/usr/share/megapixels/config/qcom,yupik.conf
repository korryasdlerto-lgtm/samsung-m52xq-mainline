Version = 1;
Make: "Samsung";
Model: "Galaxy M52 5G";

# Mainline qcom-camss (sc7280/kodiak, no ISPIF): sensor -> csiphyN -> csid0 -> vfe0_rdi0.
# Each sensor sits on its own CSI PHY (s5kgw3 csiphy0, imx258 csiphy2, gc5035 csiphy3, imx616 csiphy4).
# Megapixels knows only a "Rear" and a "Front" camera: the 50 MP main sensor and the 32 MP front one.

Rear: {
    SensorDriver: "s5kgw3";
    BridgeDriver: "qcom-camss";
    FlashPath: "/sys/class/leds/white:flash";

    Modes: (
        {
            Width: 4624;
            Height: 3468;
            Rate: 10;
            Format: "GRBG10p";
            Rotate: 270;

            Pipeline: (
                {Type: "Link", From: "msm_csiphy0", FromPad: 1, To: "msm_csid0", ToPad: 0},
                {Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},
                {Type: "Mode", Entity: "s5kgw3"},
                {Type: "Mode", Entity: "msm_csiphy0"},
                {Type: "Mode", Entity: "msm_csid0"},
                {Type: "Mode", Entity: "msm_vfe0_rdi0"}
            );
        },
        # m52xq: full 9248x6936 frame (64 MP), kernel s5kgw3 v220+ and camss width 16383 (v221+). The sensor sends a raw
        # 4-cell array here; Megapixels r64 re-mosaics it to GRBG before the DNG. Photo = largest mode, viewfinder 4624x3468.
        {
            Width: 9248;
            Height: 6936;
            Rate: 10;
            Format: "GRBG10p";
            Rotate: 270;

            Pipeline: (
                {Type: "Link", From: "msm_csiphy0", FromPad: 1, To: "msm_csid0", ToPad: 0},
                {Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},
                {Type: "Mode", Entity: "s5kgw3"},
                {Type: "Mode", Entity: "msm_csiphy0"},
                {Type: "Mode", Entity: "msm_csid0"},
                {Type: "Mode", Entity: "msm_vfe0_rdi0"}
            );
        }
    );
};

Front: {
    SensorDriver: "imx616";
    BridgeDriver: "qcom-camss";
    FlashDisplay: true;

    Modes: (
        {
            Width: 3264;
            Height: 2448;
            Rate: 10;
            Format: "RGGB10p";
            Rotate: 90;
            Mirror: true;

            Pipeline: (
                {Type: "Link", From: "msm_csiphy4", FromPad: 1, To: "msm_csid0", ToPad: 0},
                {Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},
                {Type: "Mode", Entity: "imx616"},
                {Type: "Mode", Entity: "msm_csiphy4"},
                {Type: "Mode", Entity: "msm_csid0"},
                {Type: "Mode", Entity: "msm_vfe0_rdi0"}
            );
        },
        # m52xq: full 6528x4896 frame (32 MP, the sensor re-mosaics the quad Bayer array itself), kernel imx616 v218+;
        # Megapixels takes the largest mode for the photo, the viewfinder stays on 3264x2448
        {
            Width: 6528;
            Height: 4896;
            Rate: 10;
            Format: "RGGB10p";
            Rotate: 90;
            Mirror: true;

            Pipeline: (
                {Type: "Link", From: "msm_csiphy4", FromPad: 1, To: "msm_csid0", ToPad: 0},
                {Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},
                {Type: "Mode", Entity: "imx616"},
                {Type: "Mode", Entity: "msm_csiphy4"},
                {Type: "Mode", Entity: "msm_csid0"},
                {Type: "Mode", Entity: "msm_vfe0_rdi0"}
            );
        }
    );
};

# The ultrawide camera: Megapixels switches to it by itself below 1x zoom (logical rear camera, see main.c pinch zoom);
# it is also reachable with the camera switch button.
Wide: {
    SensorDriver: "imx258";
    BridgeDriver: "qcom-camss";
    FlashPath: "/sys/class/leds/white:flash";

    Modes: (
        {
            Width: 4208;
            Height: 3120;
            Rate: 10;
            Format: "BGGR10p";
            Rotate: 270;

            Pipeline: (
                {Type: "Link", From: "msm_csiphy2", FromPad: 1, To: "msm_csid0", ToPad: 0},
                {Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},
                {Type: "Mode", Entity: "imx258"},
                {Type: "Mode", Entity: "msm_csiphy2"},
                {Type: "Mode", Entity: "msm_csid0"},
                {Type: "Mode", Entity: "msm_vfe0_rdi0"}
            );
        }
    );
};
