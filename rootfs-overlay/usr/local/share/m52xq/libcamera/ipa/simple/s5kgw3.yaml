# SPDX-License-Identifier: CC0-1.0
# m52xq: tuning for s5kgw3 (Galaxy M52 5G).
# Copy of the plasma-camera tuning WITH Agc: used by the virtual camera bridge (m52xq-virtualcam) through
# LIBCAMERA_IPA_CONFIG_PATH, because there is no SensorAe there.
# blackLevel is on the 16 bit scale: sensor pedestal 64 of 1023 (10 bit) = 4096.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 2719
          ccm: [ 1.99894, -0.41626, -0.58268,
                -0.59321,  2.18167, -0.58846,
                -0.42518, -1.21384,  2.63903 ]
        - ct: 3474
          ccm: [ 1.97712, -0.60854, -0.36858,
                -0.47723,  1.91142, -0.43418,
                -0.23092, -0.72246,  1.95339 ]
        - ct: 6890
          ccm: [ 1.93867, -0.67486, -0.26381,
                -0.43049,  2.00702, -0.57652,
                -0.15696, -0.51345,  1.67041 ]
  - Adjust:
  - Agc:
...
